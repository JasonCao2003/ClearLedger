<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人账本</title>
<link rel="stylesheet" href="/src/desktop.css">
<script type="module" src="/src/desktop.js"></script>
</head>
<body>
<header class="top"><div class="brand"><span aria-hidden="true">账</span> 个人账本</div><div class="local">本机读取 · 人民币</div></header>
<div class="layout">
<aside><nav aria-label="账本页面">
<button data-page="stats">消费统计</button>
<button data-page="calendar">消费日历</button>
<button data-page="details">月度明细</button>
<button data-page="debt">分期还款</button>
<button data-page="imports">导入核对</button>
</nav></aside>
<main>
<div class="heading"><div><p class="eyebrow">个人财务</p><h1 id="title">消费统计</h1></div>
<div class="period"><button id="prev" aria-label="上个月">‹</button><label for="month">账本月份</label><input type="month" id="month"><button id="next" aria-label="下个月">›</button></div></div>
<p id="status" role="status">正在读取账单…</p>
<section id="view"></section>
</main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div><form method="dialog"><button>关闭</button></form></dialog>
</body>
</html>
